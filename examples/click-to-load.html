<!doctype html>
<!-- 360° virtual tour embed pattern by Prewalk · https://prewalk.co · github.com/prewalkco/virtual-tour-embed-examples -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click-to-load 360° tour embed</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .tour { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #222; }
  @media (max-width: 600px) { .tour { aspect-ratio: 4 / 5; } }
  .tour img, .tour iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  .tour button {
    position: absolute; inset: auto 0 0 0; margin: auto; top: 0; width: max-content; height: max-content;
    padding: 14px 22px; border: 0; border-radius: 999px; font: 600 16px system-ui; cursor: pointer;
    background: rgba(255,255,255,.92); color: #111;
  }
</style>
</head>
<body>
<main>
  <h1>Apartment 3B</h1>

  <!-- Nothing heavy loads until the visitor clicks.
       Get YOUR_TOUR_EMBED_URL from your tour's embed code, e.g. https://prewalk.co → Share → Embed on your website. -->
  <div class="tour" data-src="YOUR_TOUR_EMBED_URL" data-title="Apartment 3B: 360° virtual tour">
    <img src="poster.jpg" alt="Living room of Apartment 3B" loading="lazy">
    <button type="button">▶ Start 360° tour</button>
  </div>
</main>

<script>
  document.querySelectorAll('.tour[data-src]').forEach((box) => {
    box.querySelector('button').addEventListener('click', () => {
      const f = document.createElement('iframe');
      f.src = box.dataset.src;
      f.title = box.dataset.title || '360° virtual tour';
      f.allow = 'fullscreen; xr-spatial-tracking; gyroscope; accelerometer';
      f.allowFullscreen = true;
      box.replaceChildren(f);
    }, { once: true });
  });
</script>
</body>
</html>
