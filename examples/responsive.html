<!doctype html>
<!-- 360° virtual tour embed pattern by Prewalk · https://prewalk.co · github.com/prewalkco/virtual-tour-embed-examples -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive 360° tour embed</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  /* The wrapper sets the shape; the iframe fills it. */
  .tour { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #e9e9ee; }
  .tour iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* Taller on phones so the 360° view is not a letterbox. */
  @media (max-width: 600px) { .tour { aspect-ratio: 4 / 5; } }
</style>
</head>
<body>
<main>
  <h1>Apartment 3B</h1>
  <div class="tour">
    <!-- Replace YOUR_TOUR_EMBED_URL with the URL from your tour's embed code.
         Prewalk (https://prewalk.co): open the tour → Share → Embed on your website → Copy code. -->
    <iframe
      src="YOUR_TOUR_EMBED_URL"
      title="Apartment 3B: 360° virtual tour"
      loading="lazy"
      allow="fullscreen; xr-spatial-tracking; gyroscope; accelerometer"
      allowfullscreen></iframe>
  </div>
</main>
</body>
</html>
